[package]
name = "hef"
description = "The HEF columnar event file format and the HEJ append-only event journal: encodings, layout, indexes, integrity, and the write path."
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
write = []

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
aho-corasick = "1.1.5"
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-schema = "59.2.0"
base64ct = { version = "1.8", features = ["alloc"] }
blake3 = { version = "1.8.7", features = ["rayon"] }
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
crc-fast = { version = "1.10.0", default-features = false, features = ["std"] }
dashmap = "6"
ed25519-dalek = "2"
fsst-rs = "0.5.11"
getrandom = "0.4.3"
hardware-rust-crypto = { version = "1.0.1", features = ["hazmat-explicit-nonce"] }
half = "2"
hashbrown = "0.17"
hex-simd = "0.8"
hkdf = "0.13.0"
k256 = { version = "0.14.0", default-features = false, features = ["ecdh", "schnorr", "std"] }
lz4_flex = "0.13.1"
memchr = "2"
miniz_oxide = "0.9.1"
multiversion = "0.8"
prost-reflect = "0.16.5"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
simd-json = "0.17.0"
simdutf8 = "0.1.5"
thiserror = "2"
type-safe-id = { version = "0.3.3", features = ["serde"] }
uuid = "1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zeekstd = "0.6.2"
zeroize = "1"
zstd = "0.13.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
aes-gcm = "0.11.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
criterion = "0.8.2"
prost = "0.14"
prost-types = "0.14"
rkyv = "0.8.18"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"

[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "vector"
harness = false

[[bench]]
name = "matrix"
harness = false
required-features = ["write"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
